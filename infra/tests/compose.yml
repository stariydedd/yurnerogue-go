services:
  backend:
    image: python:3.12.15-alpine
    command: [python, /mock_api.py]
    volumes:
      - ./mock_api.py:/mock_api.py:ro
  nginx:
    image: nginx:1.31.6-alpine
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ../nginx/:/etc/nginx/conf.d/:ro
      - ${TEST_CERT_DIR:?Set TEST_CERT_DIR}:/etc/letsencrypt/live/yurnerogue.ru:ro
      - ./web/:/usr/share/nginx/html/:ro
    depends_on:
      - backend
