services:
  backend:
    image: python:3.12-alpine
    command: [python, /mock_api.py]
    volumes:
      - ./mock_api.py:/mock_api.py:ro
  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:8443:443"
    volumes:
      - ../nginx/rogue.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TEST_CERT_DIR:?Set TEST_CERT_DIR}:/etc/letsencrypt/live/yurnerogue.ru:ro
    depends_on:
      - backend
