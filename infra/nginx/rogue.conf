# Empty keys leave leaderboard reads, health checks and static files unlimited.
map "$request_method:$uri" $run_client {
    default "";
    ~^POST:/api/runs/?$ $binary_remote_addr;
}
map $run_client $run_global {
    "" "";
    default "runs";
}
limit_req_zone $run_client zone=run_clients:10m rate=10r/m;
limit_req_zone $run_global zone=run_total:1m rate=10r/s;

server {
    listen 80;
    server_name yurnerogue.ru www.yurnerogue.ru 194.58.46.226 _;

    # ACME-челленджи certbot (webroot) должны ходить по HTTP.
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        return 301 https://yurnerogue.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name yurnerogue.ru www.yurnerogue.ru;

    ssl_certificate     /etc/letsencrypt/live/yurnerogue.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yurnerogue.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    # Тип application/wasm нужен для потоковой компиляции
    # (WebAssembly.instantiateStreaming), но задавать его здесь блоком types
    # НЕЛЬЗЯ: types заменяет всю унаследованную таблицу, и остальные файлы —
    # включая index.html — начинают отдаваться как application/octet-stream,
    # то есть браузер их скачивает вместо показа. В mime.types начиная
    # с nginx 1.21.1 wasm уже есть, отдельная запись не требуется.

    # Рядом с main.wasm деплой кладёт main.wasm.gz, сжатый по максимуму:
    # nginx отдаёт готовый файл вместо того, чтобы жать 16 МБ на каждый запрос.
    gzip_static on;

    gzip on;
    gzip_comp_level 6;
    gzip_types application/wasm application/javascript text/css application/json image/svg+xml;

    location /api/ {
        client_max_body_size 8k;
        limit_req zone=run_clients burst=10 nodelay;
        limit_req zone=run_total burst=20 nodelay;
        limit_req_status 429;
        error_page 429 = @run_rate_limited;
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location @run_rate_limited {
        default_type application/json;
        add_header Retry-After "6" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        return 429 '{"detail":"Too many submissions; retry later"}';
    }

    # Страница и бандл меняются с каждым деплоем. no-cache не запрещает
    # хранение, а требует проверки: браузер шлёт ETag и на неизменившийся
    # бандл получает 304 вместо повторной загрузки нескольких мегабайт.
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location ~ \.wasm$ {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
