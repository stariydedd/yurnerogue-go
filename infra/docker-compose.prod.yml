services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Монтируем директорию, а не один файл: rsync меняет inode файла при
      # обновлении, и bind-mount одиночного файла не отражает это в контейнере.
      - ./nginx/:/etc/nginx/conf.d/:ro
      - /var/www/rogue:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in .release.env to the release SHA image}
    env_file: .env
    depends_on:
      db-guard:
        condition: service_completed_successfully
    restart: unless-stopped

  # Одноразовая проверка перед backend: база та же, что знает сервер
  # (scripts/db-guard.sh). Пустая или чужая база останавливает запуск.
  db-guard:
    image: postgres:16-alpine
    entrypoint: ["sh", "/scripts/db-guard.sh"]
    environment:
      PGHOST: db
      PGUSER: rogue
      PGDATABASE: rogue
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./scripts/:/scripts/:ro
      - ./state/:/state/
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rogue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rogue
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rogue -d rogue"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
