# Ежемесячные пулл-реквесты с обновлениями всего, что закреплено точной версией.
# CI проверяет каждое предложение; само ничего не сливается.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    ignore:
      # Закреплённые зависимости рассчитаны на Python 3.12; Go обновляется вместе с go.mod и CI.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker-compose
    directories: [/infra, /infra/tests]
    schedule:
      interval: monthly
    ignore:
      # Новая мажорная версия PostgreSQL требует дампа и восстановления, а не смены образа.
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
