name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.26"

# Новый push заменяет ожидающий запуск, но не обрывает текущую выкладку.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "Не отформатировано:"; echo "$unformatted"; exit 1
          fi
      - name: go vet
        # Проверяем под целевой платформой: нативная сборка Ebiten на Linux
        # потребовала бы заголовков X11 и OpenGL, которые игре не нужны:
        # она уезжает в браузер.
        run: GOOS=js GOARCH=wasm go vet ./...

  test-game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Install Ebitengine dependencies
        # Пакеты render и game импортируют Ebitengine: для сборки нужны
        # заголовки X11 и OpenGL, а для запуска дисплей, потому что
        # Ebitengine поднимает GLFW в init() пакета, ещё до первого теста.
        # Сами тесты рисованием не занимаются, поэтому хватает виртуального
        # экрана xvfb.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev libxcursor-dev libxi-dev libxinerama-dev \
            libxrandr-dev libxxf86vm-dev libasound2-dev pkg-config xvfb
      - name: Run tests
        run: xvfb-run -a go test -race ./...

  test-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Test browser UI
        run: node --test web/*.test.cjs
      - name: Test browser transport
        run: GOOS=js GOARCH=wasm go test -exec="$(go env GOROOT)/lib/wasm/go_js_wasm_exec" ./internal/leaderboard ./internal/domain ./internal/sound ./internal/locale

  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: rogue
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: rogue_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rogue -d rogue_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r backend/requirements-dev.txt
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build replay verifier
        run: go build -o build/verifier ./cmd/verifier
      - name: Run backend tests
        run: pytest tests/ -v
        working-directory: backend
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://rogue:test-only@localhost:5432/rogue_test
          VERIFIER_PATH: ${{ github.workspace }}/build/verifier

  test-proxy:
    runs-on: ubuntu-latest
    env:
      TEST_CERT_DIR: ${{ github.workspace }}/build/test-certs
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test production proxy limits
        run: |
          mkdir -p "$TEST_CERT_DIR"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj /CN=yurnerogue.ru \
            -keyout "$TEST_CERT_DIR/privkey.pem" -out "$TEST_CERT_DIR/fullchain.pem"
          docker compose -p rogue-proxy-test -f infra/tests/compose.yml up -d
          docker compose -p rogue-proxy-test -f infra/tests/compose.yml exec -T nginx nginx -t
          python infra/tests/test_proxy.py
      - name: Proxy logs and cleanup
        if: always()
        run: |
          docker compose -p rogue-proxy-test -f infra/tests/compose.yml logs
          docker compose -p rogue-proxy-test -f infra/tests/compose.yml down

  test-db-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Test db-guard and the backend database role
        run: sh infra/tests/test_db_guard.sh

  build-web:
    runs-on: ubuntu-latest
    needs: [lint, test-game, test-wasm]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build WASM bundle
        run: |
          mkdir -p build/web
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o build/web/main.wasm ./cmd/game
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" build/web/
          cp web/index.html web/favicon.png build/web/
          # Предсжатые файлы рядом с оригиналом: nginx отдаёт .br браузерам
          # с brotli (на четверть меньше) и .gz остальным через gzip_static.
          gzip -9 -k build/web/main.wasm
          command -v brotli >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q brotli; }
          brotli -q 11 -k build/web/main.wasm
          ls -lh build/web/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-build
          path: build/web/
          retention-days: 7

  build-backend-image:
    runs-on: ubuntu-latest
    needs: [lint, test-backend]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/yurnerogue-backend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-web, build-backend-image, test-proxy, test-db-guard]
    if: github.ref == 'refs/heads/main'
    concurrency: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Skip superseded release
        id: release
        shell: bash
        run: |
          head=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping superseded release $GITHUB_SHA (main is $head)"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.release.outputs.current == 'true'
        with:
          name: web-build
          path: web-build
      - name: Set up SSH
        if: steps.release.outputs.current == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Ключи хоста лежат в репозитории (infra/deploy-host-keys): подключение
          # к серверу с другим ключом обрывается. ssh-keyscan не нужен, а его
          # пробные рукопожатия fail2ban на сервере считает атакой.
          sed -e '/^#/d' -e "s/^/${{ secrets.DEPLOY_HOST }} /" infra/deploy-host-keys > ~/.ssh/known_hosts
          printf 'Host *\n  StrictHostKeyChecking yes\n' > ~/.ssh/config
      - name: Upload game static and infra files
        if: steps.release.outputs.current == 'true'
        env:
          BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/yurnerogue-backend:${{ github.sha }}
        run: |
          printf 'BACKEND_IMAGE=%s\n' "$BACKEND_IMAGE" > release.env
          rsync -az --delete web-build/ root@${{ secrets.DEPLOY_HOST }}:/var/www/rogue/
          rsync -az infra/docker-compose.prod.yml root@${{ secrets.DEPLOY_HOST }}:/opt/rogue/docker-compose.yml
          rsync -az infra/nginx/ root@${{ secrets.DEPLOY_HOST }}:/opt/rogue/nginx/
          rsync -az --delete infra/scripts/ root@${{ secrets.DEPLOY_HOST }}:/opt/rogue/scripts/
          rsync -az release.env root@${{ secrets.DEPLOY_HOST }}:/opt/rogue/.release.env
      - name: Pull new backend image and restart stack
        if: steps.release.outputs.current == 'true'
        run: |
          ssh root@${{ secrets.DEPLOY_HOST }} "
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin &&
            cd /opt/rogue &&
            sh scripts/backup.sh pre-deploy &&
            docker compose --env-file .env --env-file .release.env pull -q &&
            docker compose --env-file .env --env-file .release.env up -d --remove-orphans --wait --wait-timeout 90 &&
            docker compose --env-file .env --env-file .release.env exec -T nginx nginx -t &&
            docker compose --env-file .env --env-file .release.env exec -T nginx nginx -s reload &&
            docker image prune -f
          "
      - name: Health check
        if: steps.release.outputs.current == 'true'
        run: |
          for i in $(seq 1 12); do
            if curl --max-time 10 -fsS "https://yurnerogue.ru/api/health" > /dev/null &&
               curl --max-time 10 -fsS "https://yurnerogue.ru/api/leaderboard?limit=1" > /dev/null &&
               curl --max-time 10 -fsSI "https://yurnerogue.ru/main.wasm" > /dev/null; then
              echo "Health check passed"
              exit 0
            fi
            sleep 5
          done
          echo "Health check FAILED"
          exit 1
