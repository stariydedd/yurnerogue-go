<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>YurneROGUE</title>
<link rel="icon" type="image/png" href="favicon.png" sizes="32x32">
<style>
    html, body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0a0a0a;
        /* iOS Safari «умно» увеличивает текст — из-за этого плашка загрузки
           распухала и переносилась на две строки. */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        overscroll-behavior: none;
        touch-action: none;
    }
    body {
        position: relative;
        width: 100%;
        /* Keep the engine's body size and the displayed canvas identical. */
        height: calc(var(--viewport-height, 100vh) - env(safe-area-inset-bottom, 0px)) !important;
    }
    /* Канвас на весь экран без чёрных полос. !important обязателен: Ebitengine
       выставляет размеры канваса инлайновым стилем и вписывает картинку с
       полями по краям, а инлайн перебивает обычные правила.
       pixelated держит пиксель-арт чётким при растяжении. */
    canvas {
        display: block !important;
        position: absolute !important;
        top: 0 !important;
        left: 0 !important;
        width: 100% !important;
        height: 100% !important;
        max-width: none !important;
        max-height: none !important;
        image-rendering: pixelated !important;
        background: #0a0a0a;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
    }
    #loader {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font: 14px/1.6 ui-monospace, monospace;
        color: #d4af37;
        background: #1a1a1a;
        border: 2px solid #d4af37;
        padding: 16px 28px;
        white-space: nowrap;
        z-index: 9;
    }
    #player-name {
        position: absolute;
        box-sizing: border-box;
        min-height: 32px;
        border: 0;
        outline: 0;
        border-radius: 0;
        padding: 0 8px;
        background: #121110;
        color: #f6f5f0;
        font: 18px ui-monospace, monospace;
        touch-action: manipulation;
        user-select: text;
        -webkit-user-select: text;
        z-index: 5;
    }
    #player-name:focus { outline: 2px solid #ff7018; }
</style>
<script id="viewport-sizing">
;(function () {
    function resizeViewport() {
        const viewport = window.visualViewport;
        const height = viewport && viewport.height > 0 ? viewport.height : window.innerHeight;
        document.documentElement.style.setProperty("--viewport-height", height + "px");
    }
    resizeViewport();
    window.addEventListener("resize", resizeViewport);
    window.addEventListener("pageshow", resizeViewport);
    if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", resizeViewport);
    }
})();
</script>
</head>
<body>
<div id="loader">Loading ...</div>
<input id="player-name" type="text" hidden aria-label="Player name"
       placeholder="Tap to enter name" autocomplete="nickname" autocapitalize="off"
       autocorrect="off" spellcheck="false" enterkeyhint="go" maxlength="32">
<script id="name-entry">
;(function () {
    const input = document.getElementById("player-name");
    let value = "", action = "", composing = false;
    const clean = text => Array.from(text).filter(ch => ch.codePointAt(0) >= 32).slice(0, 16).join("");
    function commit() {
        value = clean(input.value);
        if (input.value !== value) input.value = value;
    }
    input.addEventListener("compositionstart", () => { composing = true; });
    input.addEventListener("compositionend", () => { composing = false; commit(); });
    input.addEventListener("input", () => { if (!composing) commit(); });
    input.addEventListener("blur", () => { if (!composing) commit(); });
    for (const event of ["keydown", "keyup", "keypress"]) {
        input.addEventListener(event, e => {
            e.stopPropagation();
            if (event !== "keydown" || composing || e.isComposing) return;
            if (e.key === "Enter" || e.key === "Escape") {
                e.preventDefault();
                commit();
                action = e.key === "Enter" ? "start" : "back";
                input.blur();
            }
        });
    }
    window.yurneNameEntry = {
        show(name, x, y, width, height, screenW, screenH) {
            if (input.hidden) {
                input.value = value = clean(name);
                action = "";
                input.hidden = false;
            }
            input.style.left = (100*x/screenW) + "%";
            input.style.top = (100*y/screenH) + "%";
            input.style.width = (100*width/screenW) + "%";
            input.style.height = (100*height/screenH) + "%";
        },
        read() {
            const result = {value, action};
            action = "";
            return result;
        },
        hide() {
            if (input.hidden) return;
            input.blur();
            input.hidden = true;
            action = "";
            composing = false;
        }
    };
})();
</script>
<script src="wasm_exec.js"></script>
<script>
;(function () {
    // Telegram передаёт параметры запуска во фрагменте URL. Если их нет, игра
    // открыта в обычном браузере — тогда SDK не нужен и лишний запрос к
    // стороннему домену не делается.
    if (location.hash.indexOf("tgWebApp") < 0) return;

    // Объект Telegram.WebApp сам не появляется, его приносит этот скрипт.
    // Грузится он параллельно с игрой и ничего не задерживает: если домен
    // недоступен, onload просто не сработает, а игра запустится как обычно.
    var sdk = document.createElement("script");
    sdk.src = "https://telegram.org/js/telegram-web-app.js";
    sdk.onload = function () {
        var tg = window.Telegram && window.Telegram.WebApp;
        if (!tg) return;
        tg.ready();
        // expand разворачивает приложение на всю высоту экрана — без него
        // Telegram открывает его наполовину. На десктопе вызов ничего не
        // делает: размером того окна страница управлять не может.
        tg.expand();
        if (tg.disableVerticalSwipes) tg.disableVerticalSwipes();
        // Полноэкранный режим Bot API 8.0 мы не просим: на Telegram Desktop он
        // сообщает странице размер всего экрана, но окно не разворачивает —
        // канвас растягивается на 2048 px внутри окна шириной 1200, и правая
        // треть уходит за край. Режим к тому же запоминается между запусками,
        // поэтому мало его не включать, нужно выйти, если он уже включён.
        if (tg.isFullscreen && tg.exitFullscreen) {
            tg.exitFullscreen();
        }
    };
    document.head.appendChild(sdk);
})();

(async () => {
    const loader = document.getElementById("loader");
    try {
        const go = new Go();
        // instantiateStreaming компилирует модуль уже во время скачивания.
        const result = await WebAssembly.instantiateStreaming(fetch("main.wasm"), go.importObject);
        loader.remove();
        go.run(result.instance);
    } catch (e) {
        loader.textContent = "Failed to load: " + e;
    }
})();
</script>
</body>
</html>
